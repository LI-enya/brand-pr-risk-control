name: Daily Sentiment Scan

on:
  schedule:
    # Every day at 8:07 AM Japan Time (23:07 UTC previous day)
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scan and export
        run: |
          cd scripts
          python collect_data.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/all.json
          timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          git diff --cached --quiet || git commit -m "Update sentiment data: ${timestamp}"
          git push
